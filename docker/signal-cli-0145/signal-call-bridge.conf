[program:signal-call-pulse]
command=/usr/bin/pulseaudio --system --daemonize=no --disallow-exit --exit-idle-time=-1 --no-cpu-limit -nF /etc/pulse/signal-call.pa --log-target=stderr
autostart=true
autorestart=true
startsecs=2
priority=10
redirect_stderr=true
stdout_logfile=/var/log/signal-call-pulse.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2

[program:signal-call-bridge]
command=/usr/local/bin/signal-call-bridge
autostart=true
autorestart=true
startsecs=3
startretries=20
priority=30
user=signal-api
environment=PULSE_SERVER="unix:/run/pulse/native",HOME="/home/signal-api"
redirect_stderr=true
stdout_logfile=/var/log/signal-call-bridge.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
