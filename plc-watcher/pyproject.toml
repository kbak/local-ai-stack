[project]
name = "plc-watcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "stack-shared",
    "apscheduler>=3.10.0",
    "feedparser>=6.0.0",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
stack-shared = { path = "../shared", editable = true }

# Preserve deployed API major versions when refreshing the lockfile.
[tool.uv]
constraint-dependencies = ["openai<3", "mcp<2", "fastmcp<4", "apscheduler<4", "caldav<4", "icalendar<8"]
