name: stack

# Application services. Configure cross-host endpoints in .env.
# GPU inference, audio, and memory run in docker-compose.ai.yml.

services:
  searxng:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/searxng:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: docker/searxng/Dockerfile
      args:
        STACK_REVISION: ${STACK_VERSION:-dev}
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      BRAVE_SEARCH_API_KEY: "${BRAVE_SEARCH_API_KEY:-}"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?SEARXNG_SECRET must be set}"
    volumes:
      - ./config/searxng-settings.yml:/etc/searxng/settings.template.yml:ro
    entrypoint: ["/usr/local/bin/local-searxng-entrypoint.sh"]
    networks:
      - tools-net
    mem_limit: 512m

  mcp-proxy:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/mcp-proxy:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: services/mcp-proxy/Dockerfile
    container_name: mcp-proxy
    restart: unless-stopped
    ports:
      - "${MCP_PROXY_BIND_ADDRESS:-127.0.0.1}:8083:8083"
    volumes:
      - ./config/mcp-proxy-config.json:/config.json:ro
      - mcp-proxy-tool-cache:/home/tool-11000/.cache/uv
    environment:
      MCP_PROXY_AUTH_TOKEN: "${MCP_PROXY_AUTH_TOKEN:?MCP_PROXY_AUTH_TOKEN must be set}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      BROWSER_AGENT_API_TOKEN: "${BROWSER_AGENT_API_TOKEN:-}"
    command: ["--host", "0.0.0.0", "--port", "8083", "--named-server-config", "/config.json"]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8083/status', headers={'Authorization': 'Bearer ' + os.environ['MCP_PROXY_AUTH_TOKEN']}), timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - tools-net
    mem_limit: 1500m

  voice-agent:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/voice-agent:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: services/voice-agent/Dockerfile
      args:
        STACK_REVISION: ${STACK_VERSION:-dev}
    container_name: voice-agent
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      AUDIO_API_URL: "${AUDIO_API_URL:-http://host.docker.internal:8088}"
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:8080/v1}"
      MCP_PROXY_AUTH_TOKEN: "${MCP_PROXY_AUTH_TOKEN:?MCP_PROXY_AUTH_TOKEN must be set}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mcp-proxy:
        condition: service_healthy
    networks:
      - tools-net
    mem_limit: 512m

  browser-agent-api:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/browser-agent-api:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: services/browser-agent-api/Dockerfile
    container_name: browser-agent-api
    restart: unless-stopped
    ports:
      # Keep the unauthenticated experiment host-local. Change to 8092:8092
      # only after setting BROWSER_AGENT_API_TOKEN.
      - "127.0.0.1:8092:8092"
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:8080/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-vllm}"
      LLM_MODEL: "${BROWSER_AGENT_LLM_MODEL:-qwen3.8-27B-FP8}"
      BROWSER_AGENT_API_TOKEN: "${BROWSER_AGENT_API_TOKEN:-}"
      BROWSER_AGENT_MAX_CONCURRENT_TASKS: "1"
      BROWSER_AGENT_MAX_STEPS: "20"
      BROWSER_AGENT_USE_VISION: "false"
      BROWSER_AGENT_CDP_URL: "${BROWSER_AGENT_CDP_URL:-}"
      BROWSER_AGENT_STEEL_BASE_URL: "${BROWSER_AGENT_STEEL_BASE_URL:-http://steel-browser:3000}"
      BROWSER_AGENT_STEEL_PUBLIC_URL: "${BROWSER_AGENT_STEEL_PUBLIC_URL:-http://steel-browser:3000}"
      BROWSER_AGENT_STEEL_API_KEY: "${BROWSER_AGENT_STEEL_API_KEY:-}"
      BROWSER_AGENT_STEEL_PROXY_URL: "http://public-egress:8094"
      BROWSER_AGENT_STEEL_SOLVE_CAPTCHA: "${BROWSER_AGENT_STEEL_SOLVE_CAPTCHA:-false}"
      BROWSER_AGENT_STEEL_RESOLVE_WS_HOST: "${BROWSER_AGENT_STEEL_RESOLVE_WS_HOST:-true}"
      BROWSER_AGENT_TASK_TIMEOUT_SECONDS: "600"
      BROWSER_AGENT_IMAGE_DOWNLOAD_LIMIT_BYTES: "12582912"
      ANONYMIZED_TELEMETRY: "false"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - browser-agent-data:/data
    shm_size: 1gb
    networks:
      - tools-net
      - browser-net
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    depends_on:
      steel-browser:
        condition: service_started

  steel-browser:
    image: ghcr.io/steel-dev/steel-browser@sha256:21cf2a5785aa9478d0f7933c04bce96ca79f3d7a93d9824ea184800d29d3cd02
    container_name: steel-browser
    restart: unless-stopped
    environment:
      CHROME_ARGS: "--proxy-server=http://public-egress:8094 --proxy-bypass-list=<-loopback> --disable-quic --force-webrtc-ip-handling-policy=disable_non_proxied_udp"
    shm_size: 1gb
    networks:
      - browser-net
    mem_limit: 2g
    depends_on:
      public-egress:
        condition: service_started

  public-egress:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/public-egress:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: services/public-egress/Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    ports:
      - "127.0.0.1:3090:3000"
      - "127.0.0.1:9293:9223"
    networks:
      - browser-net
      - egress-net
    mem_limit: 128m

  # mongo 8.0+ hard-aborts on Linux kernel >=6.19 via a
  # version-string guard (SERVER-121912) — no env var bypasses it. The guard
  # only exists in 8.0+, and MongoDB states only "8.0 or newer" is affected, so
  # 7.0 runs clean. LibreChat supports 7.x; the 8.0 dump restores fine into it.
  # WSL (kernel 6.6) is unaffected and can stay on 8.0.
  mongodb:
    image: mongo:7.0@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      - chat-store-net
    mem_limit: 512m

  librechat:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/librechat:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: docker/librechat/Dockerfile
      args:
        STACK_REVISION: ${STACK_VERSION:-dev}
    container_name: librechat
    restart: unless-stopped
    ports:
      - "3000:3080"
    env_file:
      - .env
    environment:
      MEMORY_MCP_URL: "${MEMORY_MCP_URL:-http://host.docker.internal:8089}"
      MEMORY_API_TOKEN: "${MEMORY_API_TOKEN:?MEMORY_API_TOKEN must be set}"
      AUDIO_API_BASE_URL: "${AUDIO_API_URL:-http://host.docker.internal:8088}"
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:8080/v1}"
      # LibreChat's existing image toolkit talks to our local image model.
      IMAGE_GEN_OAI_BASEURL: "${IMAGE_GEN_OAI_BASEURL:-${LLM_BASE_URL:-http://host.docker.internal:8080/v1}}"
      IMAGE_GEN_OAI_API_KEY: "${IMAGE_GEN_OAI_API_KEY:-vllm}"
      IMAGE_GEN_OAI_MODEL: "qwen-image-2.1"
      LOCAL_IMAGE_TOOLS: "true"
      IMAGE_GEN_OAI_PROMPT_DESCRIPTION: >-
        Describe the new image in detail, including subject, composition, style,
        text, and background. This tool uses local Qwen-Image 2.1. For transparent
        output, include in the prompt: "This is an RGBA image with transparency.
        The image has alpha channel and the background is transparent."
        Use image_edit_oai when the request depends on uploaded or generated images.
      IMAGE_EDIT_OAI_PROMPT_DESCRIPTION: >-
        Describe the changes to the referenced images and what should stay the
        same. This tool uses local Qwen-Image 2.1 and accepts up to 10 reference
        images. For transparent output, explicitly request an RGBA image with
        an alpha channel and a transparent background in the prompt.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/librechat.yaml:/app/librechat.yaml.template:ro
      - librechat-data:/app/client/public/images
      - librechat-uploads:/app/uploads
      - type: bind
        source: ${MEMORY_DIR:?MEMORY_DIR must be set in .env}/SOUL.md
        target: /memory/SOUL.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEMORY_DIR:?MEMORY_DIR must be set in .env}/USER.md
        target: /memory/USER.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEMORY_DIR:?MEMORY_DIR must be set in .env}/MEMORY.md
        target: /memory/MEMORY.md
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mongodb:
        condition: service_started
      mcp-proxy:
        condition: service_healthy
    networks:
      - server-net
      - tools-net
      - chat-store-net
    mem_limit: 768m
    entrypoint: ["/bin/sh", "-c", "node /app/librechat-render.js && exec node /app/api/server/index.js"]

  signal-api:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/signal-api:${STACK_VERSION:-dev}
    pull_policy: never
    # Pinned signal-cli overlay includes the sealed-sender fix (AsamK/signal-cli#2059)
    # and experimental calling support.
    build:
      context: ./docker/signal-cli-0145
      args:
        SIGNAL_CALL_GREETING: "${SIGNAL_CALL_GREETING:-Signal calling works. Talk to you soon.}"
    container_name: signal-api
    restart: unless-stopped
    ports:
      - "9922:8080"
    volumes:
      - signal-cli-data:/home/.local/share/signal-cli
      # Reuse BRIEFING_RECIPIENT without injecting the bot's unrelated secrets
      # into signal-cli, RingRTC, and PulseAudio subprocesses.
      - ./signal-bot.env:/run/config/signal-bot.env:ro
    environment:
      # json-rpc: signal-cli stays resident (no per-call JVM cold-start). Requires
      # the bot to receive over the WebSocket (/v1/receive WS), which the
      # json-rpc-websocket-receive branch of uoltz does. AUTO_RECEIVE_SCHEDULE is
      # incompatible with json-rpc, so it's omitted.
      - MODE=json-rpc
      - PULSE_SERVER=unix:/run/pulse/native
    networks:
      - server-net
    mem_limit: 512m

  signal-bot:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/signal-bot:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: services/signal-bot/Dockerfile
      args:
        STACK_REVISION: ${STACK_VERSION:-dev}
    container_name: signal-bot
    restart: unless-stopped
    env_file:
      - ./signal-bot.env
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:8080/v1}"
      # Always let stack_shared select the currently loaded chat model.
      LLM_MODEL: ""
      AUDIO_API_URL: "${AUDIO_API_URL:-http://host.docker.internal:8088}"
      YTDLP_SERVICE_URL: "${YTDLP_SERVICE_URL:-http://host.docker.internal:8200}"
      MEMORY_MCP_URL: "${MEMORY_MCP_URL:-http://host.docker.internal:8089}"
      MEMORY_API_TOKEN: "${MEMORY_API_TOKEN:?MEMORY_API_TOKEN must be set}"
      MCP_PROXY_AUTH_TOKEN: "${MCP_PROXY_AUTH_TOKEN:?MCP_PROXY_AUTH_TOKEN must be set}"
      MEMORY_DIR_MOUNT: /memory
      MEMORY_DEFAULT_USER_ID: ${MEMORY_DEFAULT_USER_ID:-default}
      OFFLINE_EXCUSES_FILE: /app/config/offline-excuses.txt
      # Image inference can take longer when the worker must load its weights.
      AGENT_TIMEOUT_S: "${SIGNAL_AGENT_TIMEOUT_S:-360}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - signal-bot-data:/app/data
      - signal-cli-data:/signal-cli-data:ro
      - ${MUSIC_HOST_DIR:?MUSIC_HOST_DIR must be set in .env}:/music
      - ${VOICE_SAMPLES_DIR:?VOICE_SAMPLES_DIR must be set in .env}:/app/voice-samples
      - type: bind
        source: ${MEMORY_DIR:?MEMORY_DIR must be set in .env}/SOUL.md
        target: /memory/SOUL.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEMORY_DIR:?MEMORY_DIR must be set in .env}/USER.md
        target: /memory/USER.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEMORY_DIR:?MEMORY_DIR must be set in .env}/MEMORY.md
        target: /memory/MEMORY.md
        read_only: true
        bind:
          create_host_path: false
      - ${SIGNAL_OFFLINE_REPLIES_FILE:-./config/signal-offline-replies.txt}:/app/config/offline-excuses.txt:ro
    depends_on:
      signal-api:
        condition: service_healthy
      mcp-proxy:
        condition: service_healthy
      searxng:
        condition: service_started
    networks:
      - server-net
      - tools-net
    mem_limit: 1500m

  location-tracker:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/location-tracker:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: docker/watcher/Dockerfile
      target: watcher
      args:
        SERVICE: location-tracker
        MODULE: location_tracker
        SYSTEM_PACKAGES: libssl-dev ca-certificates
        STACK_REVISION: ${STACK_VERSION:-dev}
    command: ["python", "-m", "location_tracker.mcp_server"]
    container_name: location-tracker
    restart: unless-stopped
    environment:
      CALDAV_BASE_URL: "${CALDAV_BASE_URL:?CALDAV_BASE_URL must be set}"
      CALDAV_USERNAME: "${CALDAV_USERNAME:?CALDAV_USERNAME must be set}"
      CALDAV_PASSWORD: "${CALDAV_PASSWORD:?CALDAV_PASSWORD must be set}"
      CALDAV_CALENDAR_NAMES: "${CALDAV_CALENDAR_NAMES:-}"
      HOME_CITY: "${HOME_CITY:-}"
      LOCAL_TIMEZONE: "${LOCAL_TIMEZONE:-UTC}"
      POLL_INTERVAL_MINUTES: "${POLL_INTERVAL_MINUTES:-5}"
      LOOKBACK_DAYS: "${LOOKBACK_DAYS:-30}"
      LOOKAHEAD_DAYS: "${LOOKAHEAD_DAYS:-90}"
      SEARXNG_URL: "${SEARXNG_URL:-http://searxng:8080}"
      STATE_FILE: "${STATE_FILE:-/data/location_state.json}"
      MCP_PORT: "${MCP_PORT:-8084}"
      MCP_PROXY_AUTH_TOKEN: "${MCP_PROXY_AUTH_TOKEN:?MCP_PROXY_AUTH_TOKEN must be set}"
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:8080/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-${INFERENCE_API_KEY:-sk-no-key-required}}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_MODEL_FALLBACK: "${LLM_MODEL_FALLBACK:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - location-tracker-data:/data
    networks:
      - server-net
      - tools-net
    mem_limit: 512m

  pdf-inspector:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/pdf-inspector:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: services/pdf-inspector/Dockerfile
    container_name: pdf-inspector
    restart: unless-stopped
    ports:
      - "8086:8085"
    environment:
      TRANSPORT: http
      PDF_LOCAL_ROOTS: /uploads:/travel-attachments
    volumes:
      - librechat-uploads:/uploads:ro
      - travel-attachments:/travel-attachments:ro
    networks:
      - tools-net
    mem_limit: 512m

  calendar-watcher:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/calendar-watcher:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: docker/watcher/Dockerfile
      target: watcher
      args:
        SERVICE: calendar-watcher
        MODULE: calendar_watcher
        SYSTEM_PACKAGES: libssl-dev ca-certificates
        STACK_REVISION: ${STACK_VERSION:-dev}
    command: ["python", "-m", "calendar_watcher.main"]
    container_name: calendar-watcher
    restart: unless-stopped
    env_file:
      - .env
      - signal-bot.env
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:8080/v1}"
      LLM_MODEL: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - calendar-watcher-data:/data
    depends_on:
      location-tracker:
        condition: service_started
      mcp-proxy:
        condition: service_healthy
      signal-api:
        condition: service_started
      searxng:
        condition: service_started
    networks:
      - server-net
      - tools-net
    mem_limit: 512m

  receipt-watcher:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/receipt-watcher:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: docker/watcher/Dockerfile
      target: watcher
      args:
        SERVICE: receipt-watcher
        MODULE: receipt_watcher
        SYSTEM_PACKAGES: libssl-dev ca-certificates
        STACK_REVISION: ${STACK_VERSION:-dev}
    command: ["python", "-m", "receipt_watcher.main"]
    container_name: receipt-watcher
    restart: unless-stopped
    env_file:
      - .env
      - signal-bot.env
      - receipt-watcher.env
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:8080/v1}"
      LLM_MODEL: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - receipt-watcher-data:/data
      - ./services/receipt-watcher/accounts.yaml:/app/accounts.yaml:ro
      - ./services/receipt-watcher/vendors.yaml:/app/vendors.yaml:ro
      - ./services/receipt-watcher/secrets:/app/secrets:ro
    depends_on:
      - signal-api
    networks:
      - server-net
    mem_limit: 512m

  travel-watcher:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/travel-watcher:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: docker/watcher/Dockerfile
      target: watcher
      args:
        SERVICE: travel-watcher
        MODULE: travel_watcher
        SYSTEM_PACKAGES: libssl-dev ca-certificates
        STACK_REVISION: ${STACK_VERSION:-dev}
    command: ["python", "-m", "travel_watcher.main"]
    container_name: travel-watcher
    restart: unless-stopped
    env_file:
      - .env
      - travel-watcher.env
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:8080/v1}"
      LLM_MODEL: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - travel-watcher-data:/data
      - travel-attachments:/travel-attachments
    depends_on:
      - pdf-inspector
    networks:
      - server-net
      - tools-net
    mem_limit: 512m

  tg-watcher:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/tg-watcher:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: docker/watcher/Dockerfile
      target: telegram
      args:
        SERVICE: tg-watcher
        MODULE: tg_watcher
        SYSTEM_PACKAGES: libssl-dev ca-certificates
        STACK_REVISION: ${STACK_VERSION:-dev}
    command: ["python", "-m", "tg_watcher.main"]
    container_name: tg-watcher
    restart: unless-stopped
    env_file:
      - .env
      - signal-bot.env
      - tg-watcher.env
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:8080/v1}"
      LLM_MODEL: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - tg-watcher-data:/data
    depends_on:
      - signal-api
    networks:
      - server-net
    mem_limit: 512m

  oss-watcher:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/oss-watcher:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: docker/watcher/Dockerfile
      target: watcher
      args:
        SERVICE: oss-watcher
        MODULE: oss_watcher
        SYSTEM_PACKAGES: ca-certificates
        STACK_REVISION: ${STACK_VERSION:-dev}
    command: ["python", "-m", "oss_watcher.main"]
    container_name: oss-watcher
    restart: unless-stopped
    env_file:
      - .env
      - signal-bot.env
      - oss-watcher.env
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:8080/v1}"
      LLM_MODEL: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - signal-api
    networks:
      - server-net
    mem_limit: 256m

  rss-watcher:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/rss-watcher:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: docker/watcher/Dockerfile
      target: watcher
      args:
        SERVICE: rss-watcher
        MODULE: rss_watcher
        SYSTEM_PACKAGES: ca-certificates
        STACK_REVISION: ${STACK_VERSION:-dev}
    command: ["python", "-m", "rss_watcher.main"]
    container_name: rss-watcher
    restart: unless-stopped
    env_file:
      - signal-bot.env
      - rss-watcher.env
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:8080/v1}"
      LLM_MODEL: ""
      AUDIO_API_URL: "${AUDIO_API_URL:-http://host.docker.internal:8088}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./services/rss-watcher/blog-sources.json:/app/blog-sources.json:ro
    depends_on:
      - signal-api
    networks:
      - server-net
    mem_limit: 256m

  plc-watcher:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/plc-watcher:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: docker/watcher/Dockerfile
      target: watcher
      args:
        SERVICE: plc-watcher
        MODULE: plc_watcher
        SYSTEM_PACKAGES: ca-certificates fonts-noto-color-emoji
        STACK_REVISION: ${STACK_VERSION:-dev}
    command: ["python", "-m", "plc_watcher.main"]
    container_name: plc-watcher
    restart: unless-stopped
    env_file:
      - signal-bot.env
      - plc-watcher.env
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:8080/v1}"
      LLM_MODEL: ""
      AUDIO_API_URL: "${AUDIO_API_URL:-http://host.docker.internal:8088}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - signal-api
    networks:
      - server-net
    mem_limit: 512m

  nextcloud-db:
    image: mariadb:10.11@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - nextcloud-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - nextcloud-store-net
    mem_limit: 512m

  nextcloud-redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - nextcloud-store-net
    mem_limit: 128m

  nextcloud:
    image: nextcloud:33.0.9-apache@sha256:98f8db7fa866cf4a8cfabd441731be428f54854caa760bd8e022a03cac77c581
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1 ${NEXTCLOUD_TAILSCALE_HOST}
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: ${NEXTCLOUD_TAILSCALE_HOST}
      OVERWRITECLIURL: https://${NEXTCLOUD_TAILSCALE_HOST}
    volumes:
      - nextcloud-data:/var/www/html
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
    networks:
      - server-net
      - nextcloud-store-net
    mem_limit: 1024m

  nextcloud-cron:
    image: nextcloud:33.0.9-apache@sha256:98f8db7fa866cf4a8cfabd441731be428f54854caa760bd8e022a03cac77c581
    container_name: nextcloud-cron
    restart: unless-stopped
    volumes:
      - nextcloud-data:/var/www/html
    entrypoint: /cron.sh
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
    networks:
      - server-net
      - nextcloud-store-net
    mem_limit: 256m

  reverse-image-search:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/reverse-image-search:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: services/reverse-image-search/Dockerfile
    container_name: reverse-image-search
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      SAUCENAO_API_KEY: ${SAUCENAO_API_KEY:-}
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:8080/v1}"
      SEARXNG_URL: "http://searxng:8080"
    networks:
      - tools-net
    mem_limit: 256m


networks:
  tools-net:
    driver: bridge
  egress-net:
    driver: bridge
  chat-store-net:
    internal: true
  nextcloud-store-net:
    internal: true
  browser-net:
    internal: true
  server-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1

volumes:
  browser-agent-data:
  mcp-proxy-tool-cache:
  mongodb-data:
  librechat-data:
  librechat-uploads:
  signal-cli-data:
  signal-bot-data:
  location-tracker-data:
  calendar-watcher-data:
  receipt-watcher-data:
  travel-watcher-data:
  travel-attachments:
  tg-watcher-data:
  nextcloud-db:
  nextcloud-data:
