# Opt-in source mounts for local development; never used by release builds.
services:
  signal-bot:
    environment:
      PYTHONPATH: /shared:/app
    volumes:
      - ./shared:/shared:ro
      - ./services/signal-bot/skills:/app/custom_skills:ro
  voice-agent:
    environment:
      PYTHONPATH: /shared:/app
    volumes:
      - ./shared:/shared:ro
      - ./services/signal-bot/skills:/app/skills:ro
      - ./services/voice-agent/app:/app/app:ro
      - ./services/voice-agent/static:/app/static:ro
  calendar-watcher:
    environment:
      PYTHONPATH: /shared:/app
    volumes:
      - ./shared:/shared:ro
      - ./services/calendar-watcher/calendar_watcher:/app/calendar_watcher:ro
  receipt-watcher:
    environment:
      PYTHONPATH: /shared:/app
    volumes:
      - ./shared:/shared:ro
      - ./services/receipt-watcher/receipt_watcher:/app/receipt_watcher:ro
  travel-watcher:
    environment:
      PYTHONPATH: /shared:/app
    volumes:
      - ./shared:/shared:ro
      - ./services/travel-watcher/travel_watcher:/app/travel_watcher:ro
  tg-watcher:
    environment:
      PYTHONPATH: /shared:/app
    volumes:
      - ./shared:/shared:ro
      - ./services/tg-watcher/tg_watcher:/app/tg_watcher:ro
  oss-watcher:
    environment:
      PYTHONPATH: /shared:/app
    volumes:
      - ./shared:/shared:ro
      - ./services/oss-watcher/oss_watcher:/app/oss_watcher:ro
  rss-watcher:
    environment:
      PYTHONPATH: /shared:/app
    volumes:
      - ./shared:/shared:ro
      - ./services/rss-watcher/rss_watcher:/app/rss_watcher:ro
  plc-watcher:
    environment:
      PYTHONPATH: /shared:/app
    volumes:
      - ./shared:/shared:ro
      - ./services/plc-watcher/plc_watcher:/app/plc_watcher:ro
  location-tracker:
    environment:
      PYTHONPATH: /shared:/app
    volumes:
      - ./shared:/shared:ro
      - ./services/location-tracker/location_tracker:/app/location_tracker:ro
  librechat:
    volumes:
      - ./docker/librechat/render.js:/app/librechat-render.js:ro
  searxng:
    volumes:
      - ./docker/searxng/entrypoint.sh:/usr/local/bin/local-searxng-entrypoint.sh:ro
