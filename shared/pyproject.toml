[project]
name = "stack-shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0,<1", "httpcore>=1,<2"]

[project.optional-dependencies]
llm = ["openai>=1.30.0,<3"]
calendar = [
    "caldav>=1.3.1,<4",
    "icalendar>=5.0.0,<8",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "recurring-ical-events>=3.1.0",
]
scheduling = ["apscheduler>=3.10.0,<4"]
rss = ["feedparser>=6.0.0"]
skills = ["pyyaml>=6.0.0"]
web = ["starlette>=0.41.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
