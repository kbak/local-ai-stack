name: stack

services:
  qdrant:
    image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ${MEMORY_DIR:?MEMORY_DIR must be set in .env}/qdrant:/qdrant/storage
    networks:
      - ai-net
    mem_limit: 1024m

  memory-mcp:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/memory-mcp:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: services/memory-mcp/Dockerfile
    container_name: memory-mcp
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      MEMORY_LLM_BASE_URL: "http://host.docker.internal:8080/v1"
      MEMORY_QDRANT_HOST: qdrant
      MEMORY_QDRANT_PORT: "6333"
      MEMORY_ALLOWED_HOSTS: "${MEMORY_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,memory-mcp:8089,host.docker.internal:8089}"
      MEMORY_ALLOWED_ORIGINS: "${MEMORY_ALLOWED_ORIGINS:-http://localhost:8089,http://127.0.0.1:8089}"
      MEMORY_DEFAULT_USER_ID: ${MEMORY_DEFAULT_USER_ID:-default}
    extra_hosts:
      - "host.docker.internal:${AI_BRIDGE_ADDRESS:-172.18.0.1}"
    depends_on:
      - qdrant
    networks:
      - ai-net
    mem_limit: 3000m

  audio-api:
    image: ${STACK_IMAGE_PREFIX:-local-ai-stack}/audio-api:${STACK_VERSION:-dev}
    pull_policy: never
    build:
      context: .
      dockerfile: services/audio-api/Dockerfile
    container_name: audio-api
    restart: unless-stopped
    ports:
      - "8088:8088"
    env_file:
      - ./audio-api.env
    environment:
      CUDA_VISIBLE_DEVICES: ${SECONDARY_GPU:?SECONDARY_GPU must select the audio GPU}
      EXPECTED_AUDIO_GPU: "${EXPECTED_AUDIO_GPU:-}"
      HF_HOME: /app/hf-cache
      VOICE_SAMPLES_DIR: /app/voice-samples
    volumes:
      - ${VOICE_SAMPLES_DIR:?VOICE_SAMPLES_DIR must be set in .env}:/app/voice-samples:ro
      - audio-api-hf-cache:/app/hf-cache
    networks:
      - ai-net
    mem_limit: 12000m

networks:
  ai-net:
    external: true
    name: stack_ai-net

volumes:
  audio-api-hf-cache:
