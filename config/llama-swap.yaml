# The current llama-swap build only honors its listener CLI flag. start-ai.sh
# passes -listen [::1]:8080 to preserve the existing Windows Caddy origin
# without accepting LAN traffic. IPv4 and Docker clients use private relays.

# vLLM cold start (compile cache miss) on Qwen3.8-27B can take 5-10 min.
# Default 120s would kill it.
healthCheckTimeout: 900

models:
  qwen3.8-27B-FP8:
    cmd: bash ./scripts/serve-qwen-27b.sh ${PORT}
    proxy: http://127.0.0.2:${PORT}
    checkEndpoint: /v1/models
    ttl: 0

  # Muse Glimmer uses its dedicated pre-release vLLM container so the working
  # local vLLM environment used by Qwen remains unchanged.
  muse-glimmer-30B-FP8:
    cmd: bash ./scripts/serve-muse-glimmer.sh ${PORT}
    cmdStop: docker stop --timeout 30 llama-swap-muse-glimmer-${PORT}
    proxy: http://127.0.0.2:${PORT}
    checkEndpoint: /v1/models
    ttl: 0

  qwen3.6-35B-A3B-FP8:
    cmd: bash ./scripts/serve-qwen-35b-a3b.sh ${PORT}
    proxy: http://127.0.0.2:${PORT}
    checkEndpoint: /v1/models
    ttl: 0

  # Persistent FIM autocomplete on the primary GPU, alongside chat.
  qwen-coder-7B:
    cmd: bash ./scripts/serve-qwen-coder-7b.sh ${PORT}
    proxy: http://127.0.0.2:${PORT}
    checkEndpoint: /v1/models
    ttl: 0

  # Qwen Research License: evaluation/research only. Uses a dedicated CUDA
  # runtime and stays loaded without an idle timeout. See docs/qwen-image-2.1.md.
  qwen-image-2.1:
    cmd: bash ./scripts/serve-qwen-image.sh ${PORT}
    proxy: http://127.0.0.2:${PORT}
    checkEndpoint: /v1/models
    ttl: 0

  # Cross-encoder reranker on the secondary GPU (~1.1 GB weights, persistent).
  # vLLM uses --runner pooling for cross-encoder scoring.
  # Endpoint: POST /v1/score with {"model":"bge-reranker-v2-m3","text_1":"query","text_2":["doc1","doc2"]}
  bge-reranker-v2-m3:
    cmd: bash ./scripts/serve-reranker.sh ${PORT}
    proxy: http://127.0.0.2:${PORT}
    checkEndpoint: /v1/models
    ttl: 0

# Groups, all exclusive: false so they coexist on shared GPUs:
#   cuda0 (primary GPU):
#     - cuda0_main:     35B-A3B, 27B, or Muse Glimmer; one is always loaded.
#     - cuda0_coder:    coder-7B, persistent, primary-GPU autocomplete.
#     - cuda0_image:    Qwen-Image 2.1, persistent image generation and editing.
#   cuda1 (secondary GPU):
#     - cuda1_reranker: bge-reranker-v2-m3, persistent, tiny footprint.
groups:
  "cuda0_main":
    swap: true
    exclusive: false
    persistent: true
    members:
      - "qwen3.6-35B-A3B-FP8"
      - "qwen3.8-27B-FP8"
      - "muse-glimmer-30B-FP8"

  "cuda0_coder":
    swap: false
    exclusive: false
    persistent: true
    members:
      - "qwen-coder-7B"

  # Keep image generation resident alongside the chat and autocomplete models.
  "cuda0_image":
    swap: false
    exclusive: false
    persistent: true
    members:
      - "qwen-image-2.1"

  # Reranker on the secondary GPU alongside audio-api. Persistent: tiny model, no
  # reason to pay the vLLM startup cost on each request.
  "cuda1_reranker":
    swap: false
    exclusive: false
    persistent: true
    members:
      - "bge-reranker-v2-m3"
