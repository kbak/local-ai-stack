name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check-repo.py
      - run: node scripts/test-librechat-render.cjs
      - run: python3 -m unittest discover -s tests -p 'test_configuration.py' -v
      - run: python3 -m pip install -r tests/requirements.txt
      - run: python3 -m unittest discover -s tests -p 'test_shared_clients.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_runtime_helpers.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_release.py' -v
      - run: python3 -m unittest discover -s services/signal-bot/patches -p 'test_patches.py' -v
      - run: python3 scripts/check-compose.py
      - run: git diff --check
